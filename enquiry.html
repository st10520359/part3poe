<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMK Beauty Bar Springs | Book Appointment</title>
</head>
<body>

    <header>
        <h1>SMK Beauty Bar</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services & Pricing</a></li>
                <li><a href="enquiry.html">Book Appointment</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Appointment Booking Enquiry</h2>
        <p>Please fill in the form below to request a time slot at our Springs salon.</p>

        <!-- Booking Form -->
        <form action="#" method="POST">
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <label for="phone">Phone / WhatsApp Number:</label><br>
            <input type="tel" id="phone" name="phone" required><br><br>

            <label for="service">Select Service Category:</label><br>
            <select id="service" name="service">
                <option value="hair">Hair Care & Styling</option>
                <option value="nails">Acrylic / Gel Nails</option>
                <option value="lashes">Lash Extensions & Tinting</option>
                <option value="skincare">Facials & Aesthetics</option>
            </select><br><br>

            <label for="preferred-date">Preferred Date:</label><br>
            <input type="date" id="preferred-date" name="preferred-date" required><br><br>

            <label for="notes">Additional Requests or Notes:</label><br>
            <textarea id="notes" name="notes" rows="4" cols="40" placeholder="Mention specific treatments, nail artwork, or preferences..."></textarea><br><br>

            <button type="submit">Send Appointment Request</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 SMK Beauty Bar Springs. All rights reserved.</p>
    </footer>

</body>
</html>
